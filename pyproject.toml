[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neva-lattice"
version = "1.0.0"
description = "NEVA lattice analysis and reduction library"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["neva"]
